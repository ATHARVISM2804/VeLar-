<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800;900&family=Inter:wght@300;400;500;600&display=swap');

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {

}

.font-syne { font-family: 'Syne', sans-serif; }

.preloader-cursor {

/* ---------- HERO RESPONSIVE TYPE ---------- */

.hero-extraordinary { font-size: clamp(52px, 6.5vw, 9vw); white-space: nowrap; line-height: 0.88; }

  .hero-subtitle-desktop { display: none !important; }
  .hero-subtitle-mobile  { display: block !important; }
  .hero-text-block { padding-top: 90px !important; }
  .hero-heading-top { justify-content: flex-start !important; }

  .hero-extraordinary { font-size: 14.5vw !important; white-space: normal !important; word-break: break-word !important; line-height: 0.9 !important; }

  .hero-own-the { font-size: 5.5vw !important; }

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const GALLERY_VIDEOS = [
  'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260528_154759_4cdc8175-8261-497c-b688-9477c76545d4.mp4',
  'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260528_154751_39b1b9bb-2708-4211-b6a2-d39f93309e52.mp4',
  'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260528_154737_eba7900c-0313-483c-a30a-632c747ccc42.mp4',
  'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260602_144009_4348fe33-f885-4345-8e92-3fe1c2625d32.mp4',
  'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260602_145337_e44eaa8c-6bb1-4a6e-a70f-ed0231cbaccb.mp4',
];

/* ================= HELPERS ================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smoothstep = (t) => t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;

/* Inline Lucide "X" icon (no bundler needed) */
function XIcon({ size = 24, color = 'currentColor' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <path d="M18 6 6 18" /><path d="m6 6 12 12" />
    </svg>

}

/* ================= PRELOADER ================= */
function Preloader({ lifting, liftDone, visibleCount, showCursor }) {
  const style = {
    position: 'fixed', inset: 0, zIndex: 100,
    background: GRASS_GREEN,

  const letters = FULL_TEXT.split('');
  return (
    <div style={style} aria-hidden="true">
      <div className="font-syne" style={{
        fontSize: '2.6rem', color: '#fff', letterSpacing: '-0.02em',
        display: 'flex', alignItems: 'baseline', lineHeight: 1,
      }}>
        {letters.map((ch, i) => (
          <span key={i} style={{
            fontWeight: ch === '.' ? 900 : 700,
            opacity: i < visibleCount ? 1 : 0,
            transition: 'opacity 0.05s linear',
          }}>{ch}</span>
        ))}
        {showCursor && <span className="preloader-cursor" />}
      </div>

}

/* ================= NAV ================= */
function Logo({ color, size = 'text-xl' }) {
  return (
    <span className={`font-syne ${size}`} style={{ color, transition: 'color 0.35s ease', letterSpacing: '-0.01em' }}>
      <span style={{ fontWeight: 700 }}>Velar</span><span style={{ fontWeight: 900 }}>.</span>
    </span>
  );
}

function Nav({ navColor, menuOpen, setMenuOpen }) {
  const [hovered, setHovered] = useState(false);
  const links = [
    { label: 'Residences', target: 'residences' },
    { label: 'Story', target: 'story' },
    { label: 'Listings', target: 'residences' },
    { label: 'Inquire', target: 'inquire' },
  ];
  const go = (id) => {
    setMenuOpen(false);
    const el = document.getElementById(id);
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - 10;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  };
  return (
    <>
      <nav className="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-6 md:px-10 lg:px-16 py-5 md:py-6">
        <Logo color={menuOpen ? '#000000' : navColor} />
        <button
          aria-label="Menu"
          onClick={() => setMenuOpen((o) => !o)}
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
          className="relative flex flex-col items-end justify-center"
          style={{ width: 28, height: 24, gap: 8 }}
        >
          {menuOpen ? (
            <XIcon size={24} color="#000000" />
          ) : (
            <>
              <span style={{
                height: 1, background: navColor, transition: 'width 0.35s ease, background 0.35s ease',
                width: hovered ? 20 : 28, display: 'block',
              }} />
              <span style={{ height: 1, width: 28, background: navColor, transition: 'background 0.35s ease', display: 'block' }} />
            </>
          )}
        </button>
      </nav>

      <div
        className="fixed inset-0 z-40 flex flex-col items-center justify-center gap-8"
        style={{
          background: '#f5f0ea',
          opacity: menuOpen ? 1 : 0,
          pointerEvents: menuOpen ? 'auto' : 'none',
          transition: 'opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1)',
        }}
      >
        {links.map((l) => (
          <a key={l.label} href={`#${l.target}`} onClick={(e) => { e.preventDefault(); go(l.target); }}

            style={{ color: '#000', transition: 'color 0.25s ease' }}
            onMouseEnter={(e) => (e.currentTarget.style.color = '#6b7280')}
            onMouseLeave={(e) => (e.currentTarget.style.color = '#000')}>
            {l.label}
          </a>
        ))}
      </div>
    </>
  );
}

/* ================= HERO ================= */
function Hero({ heroRef, showHero }) {
  return (
    <section ref={heroRef} style={{ position: 'relative', minHeight: '100vh', overflow: 'visible' }}>
      <div style={{
        position: 'absolute', inset: 0,
        backgroundImage: `url(${BG_IMG})`,

      <div className="hero-text-block" style={{
        position: 'relative', zIndex: 10,

        transform: showHero ? 'translateY(0)' : 'translateY(-28px)',

      }}>
        <div className="hero-heading-top px-6 md:px-10 lg:px-16 flex items-end justify-between" style={{ marginBottom: '-0.04em' }}>
          <span className="hero-own-the font-syne uppercase" style={{
            fontWeight: 800, color: '#000', letterSpacing: '-0.03em', lineHeight: 1,
          }}>Live In</span>
          <p className="hero-subtitle-desktop font-syne" style={{
            textAlign: 'right', fontWeight: 700, fontSize: 'clamp(10px, 0.95vw, 14px)',
            maxWidth: 300, opacity: 0.7, lineHeight: 1.6, marginBottom: '0.2em', letterSpacing: '0.02em', color: '#000',
          }}>
            Stately homes built with vision,<br />scope, and architectural finesse.
          </p>
        </div>
        <div style={{ overflow: 'hidden' }}>
          <h1 className="hero-extraordinary font-syne uppercase px-6 md:px-10 lg:px-16" style={{
            fontWeight: 800, color: '#000', letterSpacing: '-0.03em', margin: 0,
          }}>Irreplaceable</h1>
        </div>
        <p className="hero-subtitle-mobile font-syne px-6" style={{
          fontWeight: 600, fontSize: 'clamp(12px, 3vw, 15px)', opacity: 0.65, marginTop: '0.9em', color: '#000', display: 'none',
        }}>
          Premium real estate with vision,<br />depth, and architectural clarity.
        </p>
      </div>
    </section>
  );
}

/* ================= COUNT UP ================= */
function CountUp({ end, suffix = '' }) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  const started = useRef(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting && !started.current) {
          started.current = true;
          const duration = 2000;
          const t0 = performance.now();
          const tick = (now) => {
            const t = clamp((now - t0) / duration, 0, 1);
            const eased = 1 - Math.pow(1 - t, 3);
            setVal(Math.round(eased * end));
            if (t < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        }
      });
    }, { threshold: 0.3 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [end]);
  return <span ref={ref}>{val}{suffix}</span>;
}

/* ================= DARK STATEMENT + STATS ================= */
function DarkSection({ darkRef }) {
  const stats = [

              fontSize: 'clamp(22px, 2.6vw, 42px)', paddingLeft: '25%', margin: 0,
            }}>
              Every estate we present is hand-chosen<br />

            </p>

            <div className="s2-stats-row" style={{

              paddingLeft: '25%',
            }}>
              {stats.map((s, i) => (
                <div key={i} style={{
                  flex: 1,
                  borderLeft: i === 0 ? 'none' : '1px solid rgba(255,255,255,0.2)',

                }}>

                  }}>
                    <CountUp end={s.num} suffix={s.suffix} />
                  </div>
                  <div className="font-inter" style={{
                    fontWeight: 400, color: 'rgba(255,255,255,0.6)', fontSize: 'clamp(12px, 1.1vw, 16px)',
                    marginTop: 'clamp(4px, 0.5vw, 8px)', letterSpacing: '0.01em',
                  }}>{s.label}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ================= GALLERY ================= */

/* ================= HOUSE (scroll-driven) ================= */
function House({ houseWrapRef, houseInnerRef, houseImgRef, lifting }) {
  return (
    <div ref={houseWrapRef} style={{
      position: 'fixed', zIndex: 22, pointerEvents: 'none', willChange: 'transform',
      bottom: 0, left: '50%', transform: 'translateX(-50%)', width: '100%', minWidth: 1400,
    }}>
      <div ref={houseInnerRef} style={{
        transform: lifting ? 'translateY(0)' : 'translateY(102vh)',
        transition: 'transform 1.5s cubic-bezier(0.45, 0, 0.15, 1) 0.4s',
      }}>
        <img ref={houseImgRef} src={HOUSE_IMG} alt="" aria-hidden="true"
          style={{ width: '100%', display: 'block' }} />
      </div>
    </div>
  );
}

/* ================= APP ================= */
function App() {
  const { Section7, Section8, Section9, Section10, Section11, Section12 } = window;
  // Preloader state
  const [visibleCount, setVisibleCount] = useState(0);
  const [showCursor, setShowCursor] = useState(true);
  const [lifting, setLifting] = useState(false);
  const [liftDone, setLiftDone] = useState(false);
  const [showHero, setShowHero] = useState(false);

  // Nav state
  const [navColor, setNavColor] = useState('#213138');
  const [menuOpen, setMenuOpen] = useState(false);

  // Refs
  const heroRef = useRef(null);
  const darkRef = useRef(null);
  const galleryRef = useRef(null);
  const houseWrapRef = useRef(null);
  const houseInnerRef = useRef(null);
  const houseImgRef = useRef(null);
  const liftDoneRef = useRef(false);
  // Sections 9, 11, 12 are dark — tracked for nav color
  const s9Ref = useRef(null);
  const s11Ref = useRef(null);
  const s12Ref = useRef(null);

  /* ---- Preloader timings ---- */
  useEffect(() => {
    const CHAR_INTERVAL = 140;
    const TYPE_START = 600;
    const LIFT_AT = TYPE_START + 6 * CHAR_INTERVAL + 700;
    const timers = [];
    for (let i = 0; i < FULL_TEXT.length; i++) {
      timers.push(setTimeout(() => setVisibleCount(i + 1), TYPE_START + i * CHAR_INTERVAL));
    }
    timers.push(setTimeout(() => setShowCursor(false), LIFT_AT - 150));
    timers.push(setTimeout(() => setLifting(true), LIFT_AT));
    timers.push(setTimeout(() => setShowHero(true), LIFT_AT + 1300));
    timers.push(setTimeout(() => { setLiftDone(true); liftDoneRef.current = true; }, LIFT_AT + 2100));
    return () => timers.forEach(clearTimeout);
  }, []);

  /* ---- Nav color tracking (dark sections at viewport top) ---- */
  useEffect(() => {
    const onScroll = () => {
      let onDark = false;
      [darkRef.current, galleryRef.current, s9Ref.current, s11Ref.current, s12Ref.current].forEach((el) => {
        if (!el) return;
        const r = el.getBoundingClientRect();
        if (r.top <= 0 && r.bottom > 0) onDark = true;
      });
      setNavColor(onDark ? '#ffffff' : '#213138');
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
    };
  }, []);

  /* ---- Scroll-driven house position ---- */
  const updateHousePosition = useCallback(() => {
    if (!liftDoneRef.current) return;
    const wrap = houseWrapRef.current;
    const hero = heroRef.current;
    const dark = darkRef.current;
    const img = houseImgRef.current;
    if (!wrap || !hero || !dark || !img) return;

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const baseW = Math.max(vw, 1400);
    const heroRect = hero.getBoundingClientRect();
    const darkRect = dark.getBoundingClientRect();
    const heroH = heroRect.height;
    const imgH = img.offsetHeight;

    const triggerPoint = -(heroH * 0.30);
    const endPoint = heroRect.top - (darkRect.bottom - vh);
    const denom = (endPoint - triggerPoint);
    const progress = clamp((heroRect.top - triggerPoint) / (denom === 0 ? 1 : denom), 0, 1);

    if (progress <= 0) {
      wrap.style.top = '';
      wrap.style.left = '50%';
      wrap.style.bottom = '0';
      wrap.style.transform = 'translateX(-50%)';
      wrap.style.transformOrigin = '';
      return;
    }

    const t = smoothstep(smoothstep(progress));
    const startX = (vw - baseW) / 2;
    const startY = vh - imgH;
    const finalScale = 1.45;
    const finalX = (vw - baseW * finalScale) / 2;
    const mobileOffset = vw < 1024 ? -250 : 4;
    const finalY = darkRect.bottom - imgH * finalScale + 500 + mobileOffset;

    const currentX = lerp(startX, finalX, t);
    const currentY = lerp(startY, finalY, t);
    const currentScale = lerp(1, finalScale, t);

    wrap.style.bottom = '';
    wrap.style.top = '0';
    wrap.style.left = '0';
    wrap.style.transformOrigin = 'top left';
    wrap.style.transform = `translate(${currentX}px, ${currentY}px) scale(${currentScale})`;
  }, []);

  useEffect(() => {
    if (!liftDone) return;
    if (houseInnerRef.current) houseInnerRef.current.style.transition = 'none';
    updateHousePosition();
    const handler = () => updateHousePosition();
    window.addEventListener('scroll', handler, { passive: true });
    window.addEventListener('resize', handler);
    return () => {
      window.removeEventListener('scroll', handler);
      window.removeEventListener('resize', handler);
    };
  }, [liftDone, updateHousePosition]);

  return (
    <div>
      <Preloader lifting={lifting} liftDone={liftDone} visibleCount={visibleCount} showCursor={showCursor} />
      <Nav navColor={navColor} menuOpen={menuOpen} setMenuOpen={setMenuOpen} />
      <Hero heroRef={heroRef} showHero={showHero} />
      <House houseWrapRef={houseWrapRef} houseInnerRef={houseInnerRef} houseImgRef={houseImgRef} lifting={lifting} />
      <DarkSection darkRef={darkRef} />
      <Gallery galleryRef={galleryRef} />
      <Section7 />
      <Section8 />
      <Section9 innerRef={s9Ref} />
      <Section10 />
      <Section11 innerRef={s11Ref} />
      <Section12 innerRef={s12Ref} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
